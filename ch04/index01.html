<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch04 - index01.html 파일</h1>

    <script>
      // 1. 객체가 없다면 - 학생 한 명에 대해 변수 여러 개가 필요
      let student1Name = "홍길동";
      let student1Age = 20;
      let student1Major = "컴퓨터공학과";

      // 2. 객체 리터럴 : 중괄호 안에 "키 : 값" 쌍을 쉼표로 나열
      // 즉, 관련 있는 값 여러 개가 하나로 묶임
      const student1 = {
        name: "홍길동",
        age: 20,
        major: "컴퓨터공학과",
      };
      console.log(student1);

      // 3. 속성 접근 방법 1 : 점 표기법
      console.log(student1.name);
      console.log(student1.age);

      // 4. 속성 접근 방법 2 : 대괄호 표기법. 키를 문자열로 작성
      console.log(student1["name"]);
      console.log(student1["age"]);
      console.log(student1["major"]);

      const keyName = "name";
      console.log(student1[keyName]); // 변수를 통해서 사용 가능

      // 5. 다음 학생의 정보를 저장하려면 또 하나의 객체 리터럴이 필요
      const student2 = {
        name: "김철수",
        age: 21,
        major: "경영학과",
      };
      console.log(student2);
      console.log(student2.name);
      console.log(student2.age);
      console.log(student2.major);

      // 6. 존재하지 않는 키 콘솔 출력 시도
      console.log(student2.tel); // undefined

      // 7. 객체 리터럴 생성 후 속성 추가
      student2.tel = "010-1234-1234";
      console.log(student2);
    </script>
  </body>
</html>
