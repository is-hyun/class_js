<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch04 - index04.html 파일</h1>

    <script>
      console.log("--------------- 1. 생성자 함수 ---------------");

      // 설계도 역할을 하는 함수. 함수명은 관례상 대문자로 시작
      // this 는 현재 만들어지는 중인 새 객체를 가리킨다.

      function Person(firstName, lastName) {
        this.firstName = firstName;
        this.lastName = lastName;

        this.introduce = function () {
          console.log(this.lastName + this.firstName + " 입니다.");
        };
      }

      // new 키워드를 통해 호출하면 새 객체가 생성
      const person1 = new Person("길동", "홍");
      const person2 = new Person("철수", "김");
      const person3 = new Person("영희", "이");

      console.log(person1);
      console.log(person2);
      console.log(person3);

      console.log("--------------- 2. 클래스 문법 ---------------");

      class Student {
        constructor(name, major) {
          this.name = name;
          this.major = major;
        }

        // 메서드는 클래스 내에 작성
        introduce() {
          console.log(this.name + " : " + this.major);
        }
      }

      const student1 = new Student("강민석", "체육학과");
      const student2 = new Student("장서연", "국문학과");

      console.log(student1);
      console.log(student2);
    </script>
  </body>
</html>
