<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch02 - index01.html 파일</h1>

    <script>
      // 1. 자주 사용하는 자료형 세 가지
      let age = 25; // number (정수, 실수 구분 없음)
      let nickname = "홍길동"; // string
      let isDeveloper = true; // boolean

      // 2. "값이 없음" 을 뜻하는 두 가지
      let emptyBox; // undefined : 상자는 만들었지만 아무것도 넣지 않은 상태
      let nothing = null; // 개발자가 일부로 비워두기 위해 넣는 값

      // 3. typeof 로 타입 확인
      console.log(typeof age);
      console.log(typeof nickname);
      console.log(typeof isDeveloper);
      console.log(typeof emptyBox);
      console.log(typeof nothing); // >> object

      console.log(typeof 10);
      console.log(typeof 10.5); // 정수, 실수 구분 없이 number

      // 변수 안에 들어간 값이 null인지 확인하는 방법
      console.log(nothing === null); // >> true
    </script>
  </body>
</html>
